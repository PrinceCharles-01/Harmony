<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Test de création d'utilisateur</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{background:#f7f9fb;padding:28px;font-family:Inter, system-ui, Arial}
    .card{max-width:900px;margin:24px auto;padding:18px;border-radius:12px}
    .response{margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; font-family: monospace;}
    .response.success{background-color: #d1e7dd; color: #0f5132;}
    .response.error{background-color: #f8d7da; color: #842029;}
  </style>
</head>
<body>
  <div class="card shadow-sm">
    <h3 class="mb-3">Créer un nouvel utilisateur via l'API</h3>

    <form id="createUserForm" novalidate>
      <div class="row g-3">
        
        <div class="col-md-6">
          <label for="id_matricule" class="form-label">Matricule (et Username)</label>
          <input id="id_matricule" name="matricule" type="text" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label for="id_email" class="form-label">Email</label>
          <input id="id_email" name="email" type="email" class="form-control">
        </div>

        <div class="col-md-6">
          <label for="id_password" class="form-label">Mot de passe</label>
          <input id="id_password" name="password" type="password" class="form-control" required>
        </div>

        <div class="col-md-6">
            <label for="id_role" class="form-label">Rôle</label>
            <select id="id_role" name="role" class="form-select">
                <option value="Étudiant" selected>Étudiant</option>
                <option value="Enseignant">Enseignant</option>
                <option value="Responsable Pédagogique">Responsable Pédagogique</option>
                <option value="Administrateur">Administrateur</option>
            </select>
        </div>

        <hr class="my-3">

        <div class="col-md-6">
          <label for="id_first_name" class="form-label">Prénom</label>
          <input id="id_first_name" name="first_name" type="text" class="form-control">
        </div>

        <div class="col-md-6">
          <label for="id_last_name" class="form-label">Nom</label>
          <input id="id_last_name" name="last_name" type="text" class="form-control">
        </div>

        <div class="col-md-4">
          <label for="id_date_de_naissance" class="form-label">Date de naissance</label>
          <input id="id_date_de_naissance" name="date_de_naissance" type="date" class="form-control">
        </div>

        <div class="col-md-4">
          <label for="id_lieu_de_naissance" class="form-label">Lieu de naissance</label>
          <input id="id_lieu_de_naissance" name="lieu_de_naissance" type="text" class="form-control">
        </div>

        <div class="col-md-4">
          <label for="id_nationalite" class="form-label">Nationalité</label>
          <input id="id_nationalite" name="nationalite" type="text" class="form-control">
        </div>

        <div class="col-12 d-flex justify-content-end">
          <button id="btnSubmit" type="submit" class="btn btn-primary">Créer l'utilisateur</button>
        </div>
      </div>
    </form>

    <div id="response-container" class="response" style="display: none;"></div>

  </div>

<script>
document.getElementById('createUserForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const form = e.target;
  const formData = new FormData(form);
  const data = Object.fromEntries(formData.entries());

  // Ne pas envoyer les champs de date s'ils sont vides
  if (!data.date_de_naissance) delete data.date_de_naissance;

  const responseContainer = document.getElementById('response-container');
  responseContainer.style.display = 'none';

  try {
    const response = await fetch('http://localhost:8000/api/create-user/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(data),
    });

    const result = await response.json();

    responseContainer.style.display = 'block';
    responseContainer.textContent = JSON.stringify(result, null, 2);

    if (response.ok) {
      responseContainer.className = 'response success';
      form.reset();
    } else {
      responseContainer.className = 'response error';
    }

  } catch (error) {
    responseContainer.style.display = 'block';
    responseContainer.className = 'response error';
    responseContainer.textContent = `Erreur réseau ou JSON invalide: ${error}`;
  }
});
</script>
</body>
</html>
