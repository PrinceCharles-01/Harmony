services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: harmony_db
      POSTGRES_USER: harmony_user
      POSTGRES_PASSWORD: harmony_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harmony_user -d harmony_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/Harmony_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_NAME=harmony_db
      - DATABASE_USER=harmony_user
      - DATABASE_PASSWORD=harmony_password
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

volumes:
  postgres_data: