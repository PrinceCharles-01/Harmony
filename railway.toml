[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && python Harmony_backend/manage.py collectstatic --noinput && python Harmony_backend/manage.py migrate"

[deploy]
startCommand = "gunicorn --chdir Harmony_backend harmony_backend.wsgi --bind 0.0.0.0:$PORT"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10
